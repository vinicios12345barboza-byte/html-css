<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
      h1{
        height: 300px;
        width: 300px;
        background-color: lightcyan;
        border-width: 10px;
        border-style: solid;
        border-color: darkgray;
        margin: 10px;
        padding: 10px;

        outline: 5px dashed darkblue;
      }

      a{
        border: 5px dashed darkred;
        padding: 10px;
      }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Páragrafos também são exemplos de caixa box-level, 
    mas os <a href="#">links são exemplos 
    de caixas inline-level</a> Vamos ver como tudo isso funciona.</p>
</body>
</html>

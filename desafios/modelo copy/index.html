<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="s.css">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            width: 300px;
            margin: auto;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }
        th{
            background-color: darkgray;
            color: white;
        }
        .us{
            background-color: darkgray;
            color: white;
        }
        .ns{
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Desafio tabelas</h1>

    <table>
       <thead>
           <tr>
            <th rowspan="2">ÁREA</th>
            <th rowspan="2">Disciplinas</th>
            <th colspan="2">Notas</th>
            <th rowspan="2">Média</th>
        </tr>
        <tr>
            <th>Nota1</th>
            <th>Nota2</th>
        </tr>
       </thead>
       <tbody>
        <tr>
            <th rowspan="4" class="ns">Exatas</th>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr class="us">
            <th colspan="4" scope="rowgroup">Média de Exatas</th>
            <td>0.0</td>
        </tr>
        <tr>
            <th rowspan="2" class="ns">Humanas</th>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr class="us">
            <th colspan="4">Média de Humanas</th>
            <td>0.0</td>
        </tr>
       </tbody>
    </table>
</body>
</html>
